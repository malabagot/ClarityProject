<!DOCTYPE html>
<html>
    <head>
        <title>Practise</title>
        <style>
            /* QoL CSS rules */
            * { box-sizing: border-box; }
            body { margin: 0; }

            html {
                height: 100%;
                width: 100%;
            }
            body {
                background-color: rgb(239, 152, 152);
                height: 100%;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #scrollbox {
                display: flexbox;
                background-color: aliceblue;
                height: 80%;
                width: 80%;
                z-index: 9;
                overflow: hidden;
            }
            #date_picker {
                display: flexbox;
                background-color: rgb(255, 255, 255);
                height: 15%;
                width: 100%;
                z-index: 10;
            }
            #month_picker {
                display: flex;
                background-color: blue;
                height: 65%;
                width: 100%;
                z-index: 11;
                flex-direction: row;
            }
            #day_picker {
                display: flexbox;
                background-color: aquamarine;
                height: 35%;
                width: 100%;
                z-index: 11;
            }
            .weekdays {
            display: flex;
            font-weight: bold;
            list-style-type: none;
            justify-content: space-between;
            height: 100%;
            margin: 0;
            padding: 0;
            }
            .weekdays li {
            flex: 1;
            text-align: center;
            background-color: brown;
            height: 100%;
            outline: blue;
            outline-style: groove;
            outline-width: 1%;
            }
            #month_display {
            display: flexbox;
            background-color: green;
            flex: 2;
            text-align: center;
            width: 100%;
            height: 100%;
            z-index: 12;
            }
            #month_left {
            display: flexbox;
            background-color: rgb(56, 209, 56);
            flex: 1;
            text-align: center;
            width: 100%;
            height: 100%;
            z-index: 12;
            }
            #month_right {
            display: flexbox;
            background-color: rgb(217, 252, 217);
            flex: 1;
            text-align: center;
            width: 100%;
            height: 100%;
            z-index: 12;
            }
        </style>
    </head>
    <body>
        <div id="scrollbox">
            <div id="date_picker">
                <div id="month_picker">
                    <div id="month_left">FEBUARY</div>
                    <div id="month_display">MARCH 2026</div>
                    <div id="month_right">APRIL</div>
                </div>
                <div id="day_picker">
                    <ul class="weekdays">
                    <li>Mo</li>
                    <li>Tu</li>
                    <li>We</li>
                    <li>Th</li>
                    <li>Fr</li>
                    <li>Sa</li>
                    <li>Su</li>
                    </ul>
                </div>
                <div>
                    <ul class="days">
                    <li>1</li>
                    <li>2</li>
                    <li>3</li>
                    <li>4</li>
                    <li>5</li>
                    <li>6</li>
                    <li>7</li>
                    <li>8</li>
                    <li>9</li>
                    <li>10</li>
                    <li>11</li>
                    <li>12</li>
                    <li>13</li>
                    <li>14</li>
                    <li>15</li>
                    <li>7</li>
                    <li>8</li>
                    <li>9</li>


                </div>
            </div>
        </div>
    </body>
</html>
