<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Clarity</title>
        <!-- invisible to the user, metadata about the page -->
        <meta charset="UTF-8">
        <title>Page Title</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body style="padding: 5%;">

        <div id = "gridContainer">
<!--the cut out window effect title words-->
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 3/6; grid-row: 2/3; animation-delay: 4.5s;"><div class = "boxText" style="top: 10px; letter-spacing: 9% ;">Josh</div></div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 2/5; grid-row: 1/2; animation-delay: 4s;"><div class = "boxText" style="top: 10px; letter-spacing: 9%;">Morning</div></div>

<!--all of the blank grid boxes-->
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 2 / 3; grid-row: 1/3; --from_y: 50vw; animation-delay: 0.3s;"><div class="gridBox"></div></div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 3 / 5; grid-row: 1/2; --from_x: 70vw; animation-delay: 0.6s;"><div class="gridBox"></div></div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 4 / 6; grid-row: 2/3; --from_x: 50vw; animation-delay: 1.2s;">
                <div class="gridBox"></div>
            </div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 3 / 4; grid-row: 2/3; --from_y: 50vw; animation-delay: 0.9s;">
                <div class="gridBox"></div>
            </div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 3 / 4; grid-row: 3/4; --from_y: 50vw; animation-delay: 1.5s;">
                <div class="gridBox"></div>
            </div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 6 / 7; grid-row: 2/3; --from_x: 50vw; animation-delay: 1.8s;">
                <div class="gridBox"></div>
            </div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 5 / 6; grid-row: 3/4; --from_x: 70vw; animation-delay: 2.4s;">
                <div class="gridBox"></div>
            </div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 4 / 5; grid-row: 3/6; --from_y: 50vw; animation-delay: 2.1s;">
                <div class="gridBox"></div>
            </div>
<!--THis is the finish button for 1st page-->
            <div id = "finishBox" class = "invisibleAnimationBox" style ="grid-column: 5/7; grid-row: 4/5;">
                <a href="/2ndpage" style="height: 100%; width: 100%;">
                <div class="gridBox button" style="justify-content: flex-start;">
                    <div class = "invisibleAnimationBox" style = "position: absolute; align-self: center;top: 50%;">
                        <div class = "boxText" style="font-size: 300%; color: darkred;  position: absolute; animation: none;">Finish
                        </div>
                    </div>
                    <div class = "inputWindowText" style="font-size: 200%; letter-spacing:2px; margin-top: 17.5%;">LETS GOOO!!
                    </div>
                </div>
                </a>
            </div>
<!--This is the new animation im working on
            <div id = "finishAnimation" class="invisibleAnimationBox" style="grid-column: 5/7; grid-row: 4/5;">
                <div class="gridBox finish" style="background:rgb(245, 245, 227); z-index: 0; opacity: 1;"></div>
            </div>-->

<!--the two question boxes-->
            <div class="invisibleAnimationBox slideInAnimation"style="grid-column: 6 / 8; grid-row: 3/4; --from_x: 100vw; animation-delay: 3s;">
                <div class="gridBox button" style="justify-content: flex-start;">
                    <div class = "invisibleAnimationBox" style = "position: absolute; animation-delay: 5.5s; --from_x: 0px; align-self: center;top: 50%;"><div class = "boxText" style="font-size: 300%; color: darkred;  position: absolute; animation: none;">Question</div></div>
                    <div class = "inputWindowText" style="font-size: 200%; letter-spacing:2px; margin-top: 5%;">What Time did you<br>wake up?</div>
                    <div class = "inputBox" id = "wakeup" style="background: transparent; margin-top: 2%;">
                        <input class ="inputBoxBabies" id = "wakeup_hh" type="text" inputmode="numeric">
                        <span style="line-height:1;">:</span>
                        <input class ="inputBoxBabies" id = "wakeup_mm" type="text" inputmode="numeric">
                </div>
            </div>
            </div>


            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 6 / 8; grid-row: 1/2; --from_x: 100vw; animation-delay: 2.7s;">
                <div class="gridBox button" style="justify-content: flex-start;">
                    <div class = "invisibleAnimationBox" style = "position: absolute; animation-delay: 5.0s; --from_x: 0px; align-self: center;top: 50%;"><div class = "boxText" style="font-size: 300%; color: darkred;  position: absolute; animation: none;">Question</div></div>
                    <div class = "inputWindowText" style="font-size: 200%; letter-spacing:2px; margin-top: 5%;">What Time did you<br>fall asleep?</div>
                    <div class = "inputBox" id = "fallasleep" style="background: transparent; margin-top: 2%;">
                        <input class ="inputBoxBabies" id = "fallasleep_hh" type="text" inputmode="numeric">
                        <span style="line-height:1;">:</span>
                        <input class ="inputBoxBabies" id = "fallasleep_mm" type="text" inputmode="numeric">
                </div>
            </div>



            </div>
        </div>
        </div>
        <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    </body>
</html>
