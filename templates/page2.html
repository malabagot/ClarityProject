<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <title>
            StraightForward
        </title>
    </head>
    <body>
        <div id="gridContainer" style="padding:5%;">
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 2 / 3; grid-row: 1/3; --from_y: 50vw; animation-delay: 0.3s;"><div class="gridBox"></div></div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 3 / 5; grid-row: 1/2; --from_x: 70vw; animation-delay: 0.6s;"><div class="gridBox"></div></div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 4 / 6; grid-row: 2/3; --from_x: 50vw; animation-delay: 1.2s;">
                <div class="gridBox"></div>
            </div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 3 / 4; grid-row: 2/3; --from_y: 50vw; animation-delay: 0.9s;">
                <div class="gridBox"></div>
            </div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 3 / 4; grid-row: 3/4; --from_y: 50vw; animation-delay: 1.5s;">
                <div class="gridBox"></div>
            </div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 6 / 7; grid-row: 2/3; --from_x: 50vw; animation-delay: 1.8s;">
                <div class="gridBox"></div>
            </div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 5 / 6; grid-row: 3/4; --from_x: 70vw; animation-delay: 2.4s;">
                <div class="gridBox"></div>
            </div>
            <div class="invisibleAnimationBox slideInAnimation" style="grid-column: 4 / 5; grid-row: 3/6; --from_y: 50vw; animation-delay: 2.1s;">
                <div class="gridBox"></div>
            </div>
        </div>
    </body>
</html>
